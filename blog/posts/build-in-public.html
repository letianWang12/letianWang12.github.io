      <h1>把项目、实验和思考公开记录</h1>
      <p class="lead">公开写作的意义，不只是让别人看见，更是让自己更难糊弄自己。</p>

      <section class="article-body">
        <p>
          当一个项目周期很长，最容易发生的问题不是“不会做”，而是过程变得模糊。你会记得自己忙过，却说不清具体验证了什么、放弃了什么、为什么这样选。
        </p>
        <p>
          写博客能迫使你把隐约的判断翻译成具体语言。这个过程本身就是校验：如果说不清，就说明还没想清。
        </p>
        <p>
          所以这个站点不只是一个展示页，它更像是一个公开的工作台。每篇文章都是一次阶段性结算。
        </p>
      </section>
    </main>
